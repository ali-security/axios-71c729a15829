name: 'CI'

on:
  push:
    branches:
      - '*'
      - '*/*'
      - '**'
      - '!sponsors'
  pull_request:
    branches:
      - '*'
      - '*/*'
      - '**'
      - '!sponsors'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [12.x, 14.x, 16.x, 18.x, 20.x, 22.x, 23.x]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  pack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci is required: `prepare` runs `husky install` during npm pack and
      # fails with exit 127 unless node_modules is present. husky only writes
      # .husky/, which is not packed, so the tarball bytes are unaffected.
      - run: npm ci
      # No `npm run build` here: dist/ is committed at the release tag and IS
      # the published dist/. Rebuilding would introduce drift.
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: axios-tgz
          path: axios-1.8.2.tgz
          if-no-files-found: error
